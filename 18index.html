<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאגר קלוריות</title>
<!-- EDIT_DELETE_VERSION_3 -->
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}
header{padding:20px 18px 14px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:5}
h1{margin:0;font-size:25px}.date{color:#68707a;margin-top:5px;font-size:14px}
main{padding:16px}.card{background:#f7f8fa;border:1px solid #e4e7eb;border-radius:18px;padding:16px;margin-bottom:14px}
.kcal{font-size:40px;font-weight:800}.muted{color:#68707a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.macro{background:#fff;border:1px solid #e2e5e9;border-radius:12px;padding:10px;text-align:center}.macro b{display:block;font-size:18px}
.progress{height:9px;background:#e4e7eb;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#18202a;width:0}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;cursor:pointer}.primary{width:100%;background:#18202a;color:white;font-weight:700}.secondary{background:#eef0f3}
input{width:100%;padding:13px;border:1px solid #d7dbe0;border-radius:12px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}
nav button{background:#fff;color:#606872}nav button.active{background:#18202a;color:#fff}
.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #e8eaed}.item:last-child{border-bottom:0}
.badge{font-size:12px;background:#e9edf1;padding:4px 8px;border-radius:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end;overflow:auto}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:560px;max-height:90vh;overflow-y:auto;-webkit-overflow-scrolling:touch;margin:auto;padding:20px;border-radius:22px;position:relative}
.spacer{height:75px}.hidden{display:none}
.product-actions{display:flex;gap:8px;margin-top:10px}.product-actions button{flex:1}
.danger{background:#fce8e8;color:#9b1c1c}
</style>
</head>
<body>
<div class="app">
<header><h1>מאגר קלוריות</h1><div class="date" id="date"></div></header>
<main>
<section id="today">
<div class="card"><div class="muted">נצרכו היום</div><div><span class="kcal" id="kcal">0</span> קלוריות</div><div class="progress"><span id="kbar"></span></div><div class="muted"><span id="kleft">2,000</span> קלוריות נותרו</div></div>
<div class="grid">
<div class="macro"><span>💪 חלבון</span><b id="protein">0</b><small>/ 150 ג׳</small></div>
<div class="macro"><span>🍞 פחמימות</span><b id="carbs">0</b><small>/ 200 ג׳</small></div>
<div class="macro"><span>🥑 שומן</span><b id="fat">0</b><small>/ 67 ג׳</small></div>
</div>
<div class="card" style="margin-top:14px"><button class="primary" onclick="openAdd()">＋ הוסף צריכה</button></div>
<div class="card"><b>צריכה היום</b><div id="intake"></div></div>
</section>

<section id="products" class="hidden">
<div class="card"><b>📦 <span id="productCount">0</span> מוצרים במאגר</b></div>
<div class="card"><b>חיפוש במאגר</b><input id="search" placeholder="חפש מוצר..." oninput="renderProducts()"><button class="primary" onclick="openScanner()">📷 סרוק ברקוד</button><button class="secondary" style="width:100%;margin-top:8px" onclick="openProduct()">＋ הוסף מוצר</button></div>
<div class="card" id="productList"></div>
</section>

<section id="month" class="hidden">
<div class="card"><b>חודש</b><div class="muted" style="margin-top:6px">סיכום הצריכה לפי ימים</div><div id="monthList"></div></div>
</section>
<div class="spacer"></div>
</main>
<nav>
<button id="n1" class="active" onclick="show('today')">היום</button>
<button id="n2" onclick="show('products')">מאגר</button>
<button id="n3" onclick="show('month')">חודש</button>
</nav>
</div>

<div class="modal" id="scannerModal"><div class="sheet">
<h2>סריקת ברקוד</h2>
<div id="scannerStatus" class="muted" style="margin-bottom:10px">מכין את המצלמה...</div>
<video id="barcodeVideo" playsinline muted style="width:100%;border-radius:16px;background:#111;max-height:55vh;object-fit:cover"></video><button id="captureBarcodeBtn" class="primary" style="width:100%;margin-top:12px" onclick="captureBarcode()">📸 צלם וחפש מוצר</button>
<div id="barcodeResult" class="card" style="display:none;margin-top:12px"></div>
<button class="secondary" style="width:100%;margin-top:8px" onclick="closeScanner()">✕ ביטול / סגור</button>
</div></div>

<div class="modal" id="addModal"><div class="sheet">
<h2 id="addModalTitle">הוספת צריכה</h2><input id="foodSearch" placeholder="שם מוצר / מזון" oninput="suggest()"><div id="suggestions"></div>
<select id="unitSelect" aria-label="יחידת מדידה"
style="width:100%;padding:13px;border:1px solid #d7dbe0;border-radius:12px;margin-bottom:10px;display:block"
onchange="updateIntakePreview()">
<option value="g">גרם</option>
<option value="ml">מ״ל</option>
<option value="unit">יחידה</option>
<option value="tsp">כפית</option>
<option value="tbsp">כף</option>
</select>
<input id="grams" type="number" min="0" step="any" placeholder="כמות" oninput="updateIntakePreview()">
<div id="intakePreview" class="card" style="display:none;margin-top:4px"></div>
<button class="primary" id="addIntakeBtn" onclick="addIntake()">הוסף לצריכה</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">ביטול</button>
</div></div>

<div class="modal" id="productModal"><div class="sheet">
<h2 id="productModalTitle">הוספת מוצר למאגר</h2>
<input id="pname" placeholder="שם המוצר"><input id="pbrand" placeholder="מותג"><input id="pbarcode" placeholder="ברקוד">
<input id="pweight" type="number" placeholder="משקל האריזה (גרם)"><input id="pkcal" type="number" placeholder="קלוריות ל-100 גרם">
<input id="pprotein" type="number" placeholder="חלבון ל-100 גרם"><input id="pcarbs" type="number" placeholder="פחמימות ל-100 גרם"><input id="pfat" type="number" placeholder="שומן ל-100 גרם">
<div class="card" style="margin-top:4px">
<b>המרות ליחידות</b>
<div class="muted" style="font-size:13px;margin:5px 0 10px">מלא רק כשידוע. אין צורך לנחש.</div>
<input id="punitg" type="number" min="0" step="any" placeholder="משקל יחידה אחת (גרם)">
<input id="ptspg" type="number" min="0" step="any" placeholder="משקל כפית אחת (גרם)">
<input id="ptbspg" type="number" min="0" step="any" placeholder="משקל כף אחת (גרם)">
<input id="pkcalml" type="number" min="0" step="any" placeholder="קלוריות ל-100 מ״ל">
<input id="pproteinml" type="number" min="0" step="any" placeholder="חלבון ל-100 מ״ל">
<input id="pcarbsml" type="number" min="0" step="any" placeholder="פחמימות ל-100 מ״ל">
<input id="pfatml" type="number" min="0" step="any" placeholder="שומן ל-100 מ״ל">
</div>

<button class="primary" id="saveProductBtn" onclick="saveProduct()">שמור מוצר</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">ביטול</button>
</div></div>

<script>
(function(){
  function load(src, fallback){
    var s=document.createElement('script');
    s.src=src;
    s.onload=function(){ window.__zxingLoaded=true; };
    s.onerror=function(){
      if(fallback){
        var f=document.createElement('script');
        f.src=fallback;
        f.onload=function(){ window.__zxingLoaded=true; };
        document.head.appendChild(f);
      }
    };
    document.head.appendChild(s);
  }
  load('https://unpkg.com/@zxing/browser@0.1.5/umd/zxing-browser.min.js',
       'https://cdn.jsdelivr.net/npm/@zxing/browser@0.1.5/umd/zxing-browser.min.js');
})();
</script>
<script>
let scannerControls=null, scannerStream=null;
async function openScanner(){
  lockPageScroll();
  scannerModal.classList.add('open');
  scannerStatus.textContent='מכין את המצלמה...';
  barcodeResult.style.display='none';
  try{
    if(!navigator.mediaDevices?.getUserMedia) throw new Error('camera unavailable');
    scannerStream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});
    barcodeVideo.srcObject=scannerStream;
    await barcodeVideo.play();
    if(!window.ZXingBrowser){
      scannerStatus.textContent='טוען את מנוע הסריקה...';
      let tries=0;
      while(!window.ZXingBrowser && tries<20){
        await new Promise(r=>setTimeout(r,250));
        tries++;
      }
      if(!window.ZXingBrowser){
        scannerStatus.textContent='מנוע הסריקה לא נטען. בדוק חיבור לאינטרנט ורענן פעם אחת.';
        return;
      }
    }
    scannerStatus.textContent='כוון את הברקוד למרכז ולחץ על "צלם וחפש מוצר".';
  }catch(e){
    scannerStatus.textContent='לא ניתן לפתוח את המצלמה. ודא שהאתר ב-HTTPS ואשר גישה למצלמה.';
  }
}

async function captureBarcode(){
  const btn=document.getElementById('captureBarcodeBtn');
  if(!window.ZXingBrowser){
    scannerStatus.textContent='מנוע הסריקה עדיין לא נטען. בדוק חיבור לאינטרנט ורענן פעם אחת.';
    return;
  }
  if(!barcodeVideo.videoWidth){
    scannerStatus.textContent='המצלמה עדיין נטענת. נסה שוב בעוד רגע.';
    return;
  }

  btn.disabled=true;
  btn.textContent='🔎 מזהה ברקוד...';
  scannerStatus.textContent='מצלם ומזהה את הברקוד...';

  try{
    const canvas=document.createElement('canvas');
    canvas.width=barcodeVideo.videoWidth;
    canvas.height=barcodeVideo.videoHeight;
    const ctx=canvas.getContext('2d',{willReadFrequently:true});
    ctx.drawImage(barcodeVideo,0,0,canvas.width,canvas.height);

    const imageData=canvas.toDataURL('image/jpeg',0.95);
    const reader=new ZXingBrowser.BrowserMultiFormatReader();
    const result=await reader.decodeFromImageUrl(imageData);
    const code=result.getText();

    showBarcodeResult(code);
    stopScanner();
    await searchBarcode(code);
  }catch(e){
    scannerStatus.textContent='לא זוהה ברקוד. החזק את הברקוד ישר, קרוב וחד מול המצלמה ונסה שוב.'; barcodeResult.style.display='block'; barcodeResult.innerHTML='<button class="secondary" style="width:100%" onclick="captureBarcode()">📸 נסה לצלם שוב</button>';
  }finally{
    btn.disabled=false;
    btn.textContent='📸 צלם וחפש מוצר';
  }
}
function showBarcodeResult(code){
  barcodeResult.style.display='block';
  barcodeResult.innerHTML='<b>ברקוד זוהה</b><div style="font-size:22px;margin-top:6px;word-break:break-all">'+code+'</div><div id="barcodeSearchResult" style="margin-top:12px"></div>';
  scannerStatus.textContent='הברקוד נקרא בהצלחה. מחפש מוצר...';
}
async function searchBarcode(code){
  const box=document.getElementById('barcodeSearchResult');
  box.innerHTML='<div class="muted">מחפש את המוצר לפי הברקוד...</div>';
  try{
    const url='https://world.openfoodfacts.org/api/v2/product/'+encodeURIComponent(code)+'?fields=code,product_name,brands,quantity,nutriments';
    const res=await fetch(url);
    if(!res.ok) throw new Error('HTTP '+res.status);
    const data=await res.json();
    if(data.status!==1 || !data.product){
      box.innerHTML='<div class="muted">לא נמצא מוצר עבור הברקוד הזה.</div>';
      return;
    }
    const p=data.product, n=p.nutriments||{};
    const kcal=n['energy-kcal_100g'] ?? n['energy-kcal'] ?? '';
    const protein=n['proteins_100g'] ?? n.proteins ?? 0;
    const carbs=n['carbohydrates_100g'] ?? n.carbohydrates ?? 0;
    const fat=n['fat_100g'] ?? n.fat ?? 0;
    box.innerHTML='<div class="card"><b>'+((p.product_name||'מוצר ללא שם'))+'</b>'+
  '<div class="muted" style="margin-top:6px">'+(p.brands||'')+'</div>'+
  '<div style="margin-top:8px">🔥 '+(kcal!==''?kcal:'לא ידוע')+' קל׳ / 100 ג׳</div>'+
  '<div class="muted">💪 חלבון '+protein+' · 🍞 פחמ׳ '+carbs+' · 🥑 שומן '+fat+'</div>'+
  '<div class="muted" style="margin-top:6px">ברקוד: '+code+'</div>'+
  '</div>';

window.foundProduct={
  name:p.product_name||'',
  brand:p.brands||'',
  barcode:code,
  kcal:kcal||0,
  protein:protein||0,
  carbs:carbs||0,
  fat:fat||0,
  weight:0,
  source:'Open Food Facts'
};

box.innerHTML +=
  '<button class="primary" style="margin-top:12px" onclick="addFoundProduct()">＋ הוסף למאגר</button>';
  }catch(e){
    box.innerHTML='<div class="muted">החיפוש נכשל. בדוק חיבור לאינטרנט ונסה שוב.</div>';
  }
}
function addFoundProduct(){
  try{
    const p=window.foundProduct;

    if(!p || !p.name || Number(p.kcal)<=0){
      alert('לא נמצאו נתוני תזונה מספיקים להוספת המוצר.');
      return;
    }

    const duplicateBarcode=p.barcode && db.products.findIndex(x=>
      x.barcode && String(x.barcode)===String(p.barcode)
    );

    const duplicateName=db.products.findIndex(x=>
      String(x.name||'').trim().toLowerCase()===String(p.name||'').trim().toLowerCase()
    );

    if(duplicateBarcode>=0){
      closeScanner();
      show('products');
      alert('שגיאה: מוצר עם ברקוד זה כבר קיים במאגר.');
      return;
    }

    if(duplicateName>=0){
      closeScanner();
      show('products');
      alert('שגיאה: מוצר בשם זה כבר קיים במאגר.');
      return;
    }

    p.updated=new Date().toISOString().slice(0,10);
    db.products.push(p);

    save();
    renderProducts();
    closeScanner();
    show('products');

    window.foundProduct=null;

    alert('המוצר נוסף למאגר בהצלחה.');
  }catch(e){
    console.error(e);
    alert('לא ניתן להוסיף את המוצר כרגע.');
  }
}
function stopScanner(){
  try{scannerControls?.stop();}catch(e){}
  scannerControls=null;
  scannerStream?.getTracks().forEach(t=>t.stop());
  scannerStream=null;
  if(barcodeVideo) barcodeVideo.srcObject=null;
}
function closeScanner(){stopScanner();scannerModal.classList.remove('open');if(!document.querySelector('.modal.open'))unlockPageScroll();}
</script>

(function migrateExcelProducts(){
  try{
    const raw=localStorage.getItem(KEY);
    if(!raw) return;
    const saved=JSON.parse(raw);
    if(!saved || !Array.isArray(saved.products)) return;
    const merged=[...saved.products];
    EXCEL_PRODUCTS_V63.forEach(p=>{
      const idx=merged.findIndex(x=>
        (p.barcode && x.barcode && String(p.barcode)===String(x.barcode)) ||
        (!p.barcode && x.name===p.name)
      );
      if(idx>=0) merged[idx]=Object.assign({},merged[idx],p);
      else merged.push(Object.assign({},p));
    });
    saved.products=merged;
    localStorage.setItem(KEY,JSON.stringify(saved));
    db=saved;
  }catch(e){console.error('Excel migration failed',e);}
})();

const todayKey=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function dateText(){document.getElementById('date').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function today(){return db.intake[todayKey()]||[]}
function renderToday(){
 let a=today(), k=a.reduce((s,x)=>s+x.kcal,0),p=a.reduce((s,x)=>s+x.protein,0),c=a.reduce((s,x)=>s+x.carbs,0),f=a.reduce((s,x)=>s+x.fat,0);
 kcal.textContent=Math.round(k);protein.textContent=round1(p);carbs.textContent=round1(c);fat.textContent=round1(f);
 kleft.textContent=Math.max(0,Math.round(2000-k)).toLocaleString('he-IL');kbar.style.width=Math.min(100,k/2000*100)+'%';
 intake.innerHTML=a.length?a.map((x,i)=>`<div class="item"><div><b>${x.name}</b><div class="muted">${x.amount??x.grams} ${x.unitLabel||'גרם'} · ${Math.round(x.kcal)} קל׳</div><div class="muted">💪 ${round1(x.protein)} · 🍞 ${round1(x.carbs)} · 🥑 ${round1(x.fat)}</div></div><div style="display:flex;flex-direction:column;gap:6px"><button class="secondary" onclick="editIntake(${i})">✏️ ערוך</button><button class="secondary" onclick="removeIntake(${i})">🗑️ מחק</button></div></div>`).join(''):'<div class="muted" style="padding-top:12px">עדיין לא דווחה צריכה היום.</div>';
}
function round1(v){return Math.round(Number(v||0)*10)/10}
function renderProducts(){
 productCount.textContent=db.products.length;
 let q=(search.value||'').toLowerCase(),arr=db.products.filter(x=>(x.name+' '+(x.brand||'')+' '+(x.barcode||'')).toLowerCase().includes(q));
 productList.innerHTML=arr.map(x=>{const i=db.products.indexOf(x);return `<div class="item"><div style="flex:1"><b>${x.name}</b><div class="muted">${x.brand||''} · ${x.kcal} קל׳ / 100 ג׳</div><div class="muted">חלבון ${x.protein||0} · פחמ׳ ${x.carbs||0} · 🥑 ${x.fat||0}</div></div><div style="display:flex;flex-direction:column;gap:6px;min-width:76px"><span class="badge">${x.weight||''} ג׳</span><button class="secondary" onclick="editProduct(${i})">✏️ ערוך</button><button class="secondary" onclick="deleteProduct(${i})">🗑️ מחק</button></div></div>`}).join('')||'<div class="muted">לא נמצאו מוצרים.</div>';
}
function renderMonth(){
 let keys=Object.keys(db.intake).sort().reverse(), sums=keys.map(d=>{let a=db.intake[d];return [d,a.reduce((s,x)=>s+x.kcal,0),a.reduce((s,x)=>s+x.protein,0),a.reduce((s,x)=>s+x.carbs,0),a.reduce((s,x)=>s+x.fat,0)]});
 monthList.innerHTML=sums.length?sums.map(x=>`<div class="item"><div><b>${new Date(x[0]+'T12:00:00').toLocaleDateString('he-IL')}</b><div class="muted">🔥 ${Math.round(x[1])} · 💪 ${x[2].toFixed(1)} · 🍞 ${x[3].toFixed(1)} · 🥑 ${x[4].toFixed(1)}</div></div></div>`).join(''):'<div class="muted" style="padding-top:12px">אין עדיין נתונים.</div>';
}
function show(id){['today','products','month'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['n1','n2','n3'].forEach((x,i)=>document.getElementById(x).classList.toggle('active',['today','products','month'][i]===id));if(id==='today')renderToday();if(id==='products')renderProducts();if(id==='month')renderMonth()}
function lockPageScroll(){document.body.style.overflow='hidden';}
function unlockPageScroll(){document.body.style.overflow='';}
function openAdd(){
  window.editingIntakeIndex=null;
  addModalTitle.textContent='הוספת צריכה';
  addIntakeBtn.textContent='הוסף לצריכה';

  unitSelect.value='g';
  unitSelect.style.display='block';
  intakePreview.style.display='none';
  suggest();
}
function openProduct(){window.editingProductIndex=null;document.querySelector('#productModal h2').textContent='הוספת מוצר למאגר';document.querySelectorAll('#productModal input').forEach(x=>x.value='');lockPageScroll();productModal.classList.add('open')}
function closeModal(){
 document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'));
 unlockPageScroll();
 window.editingIntakeIndex=null;
}
function suggest(){let q=(foodSearch.value||'').toLowerCase();let a=db.products.filter(x=>(x.name+' '+(x.brand||'')).toLowerCase().includes(q)).slice(0,5);suggestions.innerHTML=a.map(x=>`<button class="secondary" style="margin:3px" onclick="selectFood(${db.products.indexOf(x)})">${x.name}</button>`).join('')}
let selected=null;
function selectFood(i){
  selected=db.products[i];
  foodSearch.value=selected.name;
  suggestions.innerHTML='<span class="muted">נבחר: '+selected.name+'</span>';
  unitSelect.style.display='block';
  grams.focus({preventScroll:true});
  updateIntakePreview();
}
function getUnitConversion(p,unit){
 const text=((p.name||'')+' '+(p.brand||'')).toLowerCase();
 if(unit==='unit'&&Number(p.unit_g)>0)return Number(p.unit_g);
 if(unit==='tsp'&&Number(p.tsp_g)>0)return Number(p.tsp_g);
 if(unit==='tbsp'&&Number(p.tbsp_g)>0)return Number(p.tbsp_g);
 return 0;
}
function calcIntake(p,unit,a){
 a=Number(a)||0;let g=null;
 if(unit==='g')g=a;
 if(unit==='unit'){const v=getUnitConversion(p,'unit');if(v>0)g=a*v;}
 if(unit==='tsp'){const v=getUnitConversion(p,'tsp');if(v>0)g=a*v;}
 if(unit==='tbsp'){const v=getUnitConversion(p,'tbsp');if(v>0)g=a*v;}
 if(unit==='ml'&&Number(p.kcal_ml)>0)return {known:true,kcal:Number(p.kcal_ml)*a,protein:Number(p.protein_ml||0)*a,carbs:Number(p.carbs_ml||0)*a,fat:Number(p.fat_ml||0)*a};
 if(g===null)return {known:false,kcal:0,protein:0,carbs:0,fat:0};
 let r=g/100;return {known:true,kcal:Number(p.kcal||0)*r,protein:Number(p.protein||0)*r,carbs:Number(p.carbs||0)*r,fat:Number(p.fat||0)*r};
}
function updateIntakePreview(){
 if(!selected||!(Number(grams.value)>0)){intakePreview.style.display='none';return}
 let r=calcIntake(selected,unitSelect.value,grams.value);intakePreview.style.display='block';
 intakePreview.innerHTML=r.known?`<b>לפני הוספה</b><div style="margin-top:8px">🔥 ${round1(r.kcal)} קלוריות</div><div class="muted">💪 ${round1(r.protein)} ג׳ חלבון · 🍞 ${round1(r.carbs)} ג׳ פחמימות · 🥑 ${round1(r.fat)} ג׳ שומן</div>`:`<b>אין נתון המרה</b><div class="muted">אין במאגר נתון מתאים ליחידת המדידה הזו.</div>`;
}
function addIntake(){
 let a=Number(grams.value);if(!selected)selected=db.products.find(x=>x.name===foodSearch.value.trim());
 if(!selected||!a||a<=0)return alert('בחר מוצר והזן כמות');
 let unit=unitSelect.value||'g',r=calcIntake(selected,unit,a);if(!r.known)return alert('אין במאגר נתון המרה מתאים ליחידת המדידה שנבחרה.');
 let label=unitSelect.options[unitSelect.selectedIndex]?.text||'גרם';
 let item={name:selected.name,amount:a,unit:unit,unitLabel:label,kcal:r.kcal,protein:r.protein,carbs:r.carbs,fat:r.fat};
 if(window.editingIntakeIndex!==null&&window.editingIntakeIndex!==undefined)db.intake[todayKey()][window.editingIntakeIndex]=item;else(db.intake[todayKey()]??=[]).push(item);
 save();selected=null;grams.value='';foodSearch.value='';intakePreview.style.display='none';closeModal();renderToday();
}
function editIntake(i){
 let x=today()[i],idx=db.products.findIndex(p=>p.name===x.name);if(!x||idx<0)return alert('המוצר לא נמצא במאגר.');
 window.editingIntakeIndex=i;addModalTitle.textContent='עריכת צריכה';addIntakeBtn.textContent='שמור שינוי';lockPageScroll();addModal.classList.add('open');selectFood(idx);unitSelect.value=x.unit||'g';grams.value=x.amount??x.grams??'';updateIntakePreview();
}
function removeIntake(i){if(!today()[i])return;if(!confirm('למחוק את הצריכה הזו?'))return;today().splice(i,1);save();renderToday()}
function saveProduct(){
 let p={
  name:pname.value.trim(),brand:pbrand.value.trim(),barcode:pbarcode.value.trim(),
  weight:Number(pweight.value)||0,kcal:Number(pkcal.value)||0,
  protein:Number(pprotein.value)||0,carbs:Number(pcarbs.value)||0,fat:Number(pfat.value)||0,
  unit_g:Number(punitg.value)||0,tsp_g:Number(ptspg.value)||0,tbsp_g:Number(ptbspg.value)||0,
  kcal_ml:Number(pkcalml.value)||0,protein_ml:Number(pproteinml.value)||0,
  carbs_ml:Number(pcarbsml.value)||0,fat_ml:Number(pfatml.value)||0,
  source:'הוזן ידנית',updated:new Date().toISOString().slice(0,10)
 };
 if(!p.name||!p.kcal)return alert('שם המוצר וקלוריות ל-100 גרם הם חובה');
 const editing=window.editingProductIndex;
 const duplicate=db.products.findIndex((x,i)=>i!==editing&&p.barcode&&x.barcode===p.barcode);
 if(duplicate>=0)return alert('המוצר או הברקוד כבר קיימים במאגר.');
 if(editing!==null&&editing!==undefined)db.products[editing]=p;else db.products.push(p);
 save();document.querySelectorAll('#productModal input').forEach(x=>x.value='');closeModal();renderProducts();
}
function editProduct(i){
 const p=db.products[i];if(!p)return;
 window.editingProductIndex=i;
 document.querySelector('#productModal h2').textContent='עריכת מוצר';
 lockPageScroll();productModal.classList.add('open');
 pname.value=p.name||'';pbrand.value=p.brand||'';pbarcode.value=p.barcode||'';pweight.value=p.weight||'';
 pkcal.value=p.kcal||'';pprotein.value=p.protein||'';pcarbs.value=p.carbs||'';pfat.value=p.fat||'';
 punitg.value=p.unit_g||'';ptspg.value=p.tsp_g||'';ptbspg.value=p.tbsp_g||'';
 pkcalml.value=p.kcal_ml||'';pproteinml.value=p.protein_ml||'';pcarbsml.value=p.carbs_ml||'';pfatml.value=p.fat_ml||'';
}
function deleteProduct(i){
 const p=db.products[i];if(!p)return;
 if(!confirm('למחוק את המוצר "'+p.name+'" מהמאגר?'))return;
 db.products.splice(i,1);save();renderProducts();
}
dateText();renderToday();
