<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>מאגר קלוריות</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;background:#fff}
header{padding:20px 18px 14px;border-bottom:1px solid #e5e7eb;position:sticky;top:0;background:#fff;z-index:5}
h1{margin:0;font-size:25px}.date{color:#68707a;margin-top:5px;font-size:14px}
main{padding:16px}.card{background:#f7f8fa;border:1px solid #e4e7eb;border-radius:18px;padding:16px;margin-bottom:14px}
.kcal{font-size:40px;font-weight:800}.muted{color:#68707a}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.macro{background:#fff;border:1px solid #e2e5e9;border-radius:12px;padding:10px;text-align:center}.macro b{display:block;font-size:18px}
.progress{height:9px;background:#e4e7eb;border-radius:20px;overflow:hidden;margin:10px 0}.progress span{display:block;height:100%;background:#18202a;width:0}
button,input{font:inherit}button{border:0;border-radius:12px;padding:12px 14px;cursor:pointer}.primary{width:100%;background:#18202a;color:white;font-weight:700}.secondary{background:#eef0f3}
input{width:100%;padding:13px;border:1px solid #d7dbe0;border-radius:12px;margin-bottom:10px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);max-width:560px;width:100%;background:#fff;border-top:1px solid #ddd;display:grid;grid-template-columns:repeat(3,1fr);padding:8px}
nav button{background:#fff;color:#606872}nav button.active{background:#18202a;color:#fff}
.item{display:flex;justify-content:space-between;gap:10px;padding:13px 0;border-bottom:1px solid #e8eaed}.item:last-child{border-bottom:0}
.badge{font-size:12px;background:#e9edf1;padding:4px 8px;border-radius:20px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:10;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:560px;margin:auto 0 0;padding:20px;border-radius:22px 22px 0 0}
.spacer{height:75px}.hidden{display:none}
</style>
</head>
<body>
<div class="app">
<header><h1>מאגר קלוריות</h1><div class="date" id="date"></div></header>
<main>
<section id="today">
<div class="card"><div class="muted">נצרכו היום</div><div><span class="kcal" id="kcal">0</span> קלוריות</div><div class="progress"><span id="kbar"></span></div><div class="muted"><span id="kleft">2,000</span> קלוריות נותרו</div></div>
<div class="grid">
<div class="macro"><span>💪 חלבון</span><b id="protein">0</b><small>/ 150 ג׳</small></div>
<div class="macro"><span>🍞 פחמימות</span><b id="carbs">0</b><small>/ 200 ג׳</small></div>
<div class="macro"><span>🥑 שומן</span><b id="fat">0</b><small>/ 67 ג׳</small></div>
</div>
<div class="card" style="margin-top:14px"><button class="primary" onclick="openAdd()">＋ הוסף צריכה</button></div>
<div class="card"><b>צריכה היום</b><div id="intake"></div></div>
</section>

<section id="products" class="hidden">
<div class="card"><b>📦 <span id="productCount">0</span> מוצרים במאגר</b></div>
<div class="card"><b>חיפוש במאגר</b><input id="search" placeholder="חפש מוצר..." oninput="renderProducts()"><button class="primary" onclick="openProduct()">＋ הוסף מוצר</button></div>
<div class="card" id="productList"></div>
</section>

<section id="month" class="hidden">
<div class="card"><b>חודש</b><div class="muted" style="margin-top:6px">סיכום הצריכה לפי ימים</div><div id="monthList"></div></div>
</section>
<div class="spacer"></div>
</main>
<nav>
<button id="n1" class="active" onclick="show('today')">היום</button>
<button id="n2" onclick="show('products')">מאגר</button>
<button id="n3" onclick="show('month')">חודש</button>
</nav>
</div>

<div class="modal" id="addModal"><div class="sheet">
<h2>הוספת צריכה</h2><input id="foodSearch" placeholder="שם מוצר / מזון" oninput="suggest()"><div id="suggestions"></div>
<input id="grams" type="number" placeholder="כמות בגרמים">
<button class="primary" onclick="addIntake()">הוסף</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">ביטול</button>
</div></div>

<div class="modal" id="productModal"><div class="sheet">
<h2>הוספת מוצר למאגר</h2>
<input id="pname" placeholder="שם המוצר"><input id="pbrand" placeholder="מותג"><input id="pbarcode" placeholder="ברקוד">
<input id="pweight" type="number" placeholder="משקל האריזה (גרם)"><input id="pkcal" type="number" placeholder="קלוריות ל-100 גרם">
<input id="pprotein" type="number" placeholder="חלבון ל-100 גרם"><input id="pcarbs" type="number" placeholder="פחמימות ל-100 גרם"><input id="pfat" type="number" placeholder="שומן ל-100 גרם">
<button class="primary" onclick="saveProduct()">שמור מוצר</button><button class="secondary" style="width:100%;margin-top:8px" onclick="closeModal()">ביטול</button>
</div></div>

let savedDB=JSON.parse(localStorage.getItem(KEY)||'null');

if(!Array.isArray(db.products)||db.products.length<SEED_DB.products.length){

const todayKey=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(db))}
function dateText(){document.getElementById('date').textContent=new Date().toLocaleDateString('he-IL',{weekday:'long',day:'numeric',month:'long',year:'numeric'})}
function today(){return db.intake[todayKey()]||[]}
function renderToday(){
 let a=today(), k=a.reduce((s,x)=>s+x.kcal,0),p=a.reduce((s,x)=>s+x.protein,0),c=a.reduce((s,x)=>s+x.carbs,0),f=a.reduce((s,x)=>s+x.fat,0);
 kcal.textContent=Math.round(k);protein.textContent=Math.round(p*10)/10;carbs.textContent=Math.round(c*10)/10;fat.textContent=Math.round(f*10)/10;
 kleft.textContent=Math.max(0,Math.round(2000-k)).toLocaleString('he-IL');kbar.style.width=Math.min(100,k/2000*100)+'%';
 intake.innerHTML=a.length?a.map((x,i)=>`<div class="item"><div><b>${x.name}</b><div class="muted">${x.grams} ג׳ · ${Math.round(x.kcal)} קל׳</div></div><button class="secondary" onclick="removeIntake(${i})">מחק</button></div>`).join(''):'<div class="muted" style="padding-top:12px">עדיין לא דווחה צריכה היום.</div>';
}
function renderProducts(){
 productCount.textContent=db.products.length;
 let q=(search.value||'').toLowerCase(), arr=db.products.filter(x=>(x.name+' '+x.brand+' '+x.barcode).toLowerCase().includes(q));
 productList.innerHTML=arr.map(x=>`<div class="item"><div><b>${x.name}</b><div class="muted">${x.brand||''} · ${x.kcal} קל׳ / 100 ג׳</div><div class="muted">חלבון ${x.protein||0} · פחמ׳ ${x.carbs||0} · שומן ${x.fat||0}</div></div><span class="badge">${x.weight||''} ג׳</span></div>`).join('')||'<div class="muted">לא נמצאו מוצרים.</div>';
}
function renderMonth(){
 let keys=Object.keys(db.intake).sort().reverse(), sums=keys.map(d=>{let a=db.intake[d];return [d,a.reduce((s,x)=>s+x.kcal,0),a.reduce((s,x)=>s+x.protein,0),a.reduce((s,x)=>s+x.carbs,0),a.reduce((s,x)=>s+x.fat,0)]});
 monthList.innerHTML=sums.length?sums.map(x=>`<div class="item"><div><b>${new Date(x[0]+'T12:00:00').toLocaleDateString('he-IL')}</b><div class="muted">🔥 ${Math.round(x[1])} · 💪 ${x[2].toFixed(1)} · 🍞 ${x[3].toFixed(1)} · 🥑 ${x[4].toFixed(1)}</div></div></div>`).join(''):'<div class="muted" style="padding-top:12px">אין עדיין נתונים.</div>';
}
function show(id){['today','products','month'].forEach(x=>document.getElementById(x).classList.toggle('hidden',x!==id));['n1','n2','n3'].forEach((x,i)=>document.getElementById(x).classList.toggle('active',['today','products','month'][i]===id));if(id==='today')renderToday();if(id==='products')renderProducts();if(id==='month')renderMonth()}
function openAdd(){addModal.classList.add('open');foodSearch.focus();suggest()}
function openProduct(){productModal.classList.add('open')}
function closeModal(){document.querySelectorAll('.modal').forEach(x=>x.classList.remove('open'))}
function suggest(){let q=(foodSearch.value||'').toLowerCase();let a=db.products.filter(x=>x.name.toLowerCase().includes(q)).slice(0,5);suggestions.innerHTML=a.map((x,i)=>`<button class="secondary" style="margin:3px" onclick="selectFood(${db.products.indexOf(x)})">${x.name}</button>`).join('')}
let selected=null;
function selectFood(i){selected=db.products[i];foodSearch.value=selected.name;suggestions.innerHTML='<span class="muted">נבחר: '+selected.name+'</span>';grams.focus()}
function addIntake(){
 let g=Number(grams.value);if(!selected){let n=foodSearch.value.trim();selected=db.products.find(x=>x.name===n)}if(!selected||!g)return alert('בחר מוצר והזן כמות');
 let r=g/100,x={name:selected.name,grams:g,kcal:selected.kcal*r,protein:(selected.protein||0)*r,carbs:(selected.carbs||0)*r,fat:(selected.fat||0)*r};
 (db.intake[todayKey()]??=[]).push(x);save();selected=null;grams.value='';foodSearch.value='';closeModal();renderToday();
}
