<!doctype html><html lang="he" dir="rtl"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>מאגר קלוריות</title>
<style>
body{margin:0;background:#f5f6f8;color:#18202a;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
.app{max-width:560px;margin:auto;min-height:100vh;padding-bottom:90px}header{background:white;padding:18px;border-bottom:1px solid #ddd;position:sticky;top:0}
main{padding:16px}.title{font-size:25px;font-weight:800;margin:4px 0 15px}.card{background:#fff;border:1px solid #e1e4e8;border-radius:18px;padding:16px;margin-bottom:14px}
.kcal{font-size:40px;font-weight:850}.muted{color:#707985;font-size:13px}.macro{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}.macro div{background:#f4f5f7;padding:10px;border-radius:12px;text-align:center}.macro b{display:block;font-size:18px}
button{font:inherit}nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid #ddd;display:flex;padding:8px;z-index:10}nav button{flex:1;border:0;background:#f1f2f4;border-radius:12px;padding:13px;margin:0 3px;color:#59616c;font-weight:700}nav button.active{background:#18202a;color:#fff}
input{width:100%;box-sizing:border-box;padding:13px;border:1px solid #dfe3e7;border-radius:12px;font-size:16px;margin-bottom:9px}.item{padding:13px 0;border-bottom:1px solid #eee;display:flex;justify-content:space-between;gap:10px}.item:last-child{border:0}.item small{display:block;color:#707985;margin-top:4px}
.primary{width:100%;background:#18202a;color:white;border:0;border-radius:13px;padding:14px;font-weight:750;font-size:16px}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;align-items:flex-end}.modal.open{display:flex}.sheet{background:#fff;width:100%;max-width:560px;margin:auto;border-radius:20px 20px 0 0;padding:18px;max-height:88vh;overflow:auto}.choice{padding:12px;border-bottom:1px solid #eee}
</style></head><body><div class="app"><header><b>מאגר קלוריות</b><div class="muted" id="date"></div></header><main id="screen"></main>
<nav><button id="todayBtn">היום</button><button id="dbBtn">מאגר</button><button id="monthBtn">חודש</button></nav></div>
<div class="modal" id="modal"><div class="sheet"><h2>הוסף מזון</h2><input id="search" placeholder="חפש מוצר או ברקוד"><div id="choices"></div><div id="amountBox" style="display:none"><input id="amount" type="number" min="0" placeholder="כמות בגרמים"><button class="primary" id="add">הוסף לצריכה</button></div></div></div>
<script>
const DATA={"products": [{"name": "Kinder Délice Cacao", "brand": "Kinder / Ferrero", "barcode": "8000500267035", "weight": "39 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "פסק זמן קלאסי חטיף שוקולד חלב במילוי ופל וקרם אגוזים", "brand": "עלית", "barcode": "72991008", "weight": "45 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "תה ויסוצקי רגיל", "brand": "ויסוצקי", "barcode": "", "weight": "ללא הגבלה", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "סוכר לבן", "brand": "כללי", "barcode": "", "weight": "לפי כמות", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "לחם לבן פרוס אנג'ל", "brand": "אנג'ל", "barcode": "", "weight": "לפי פרוסה", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ביצה", "brand": "כללי", "barcode": "", "weight": "1 ביצה", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "שמן", "brand": "כללי", "barcode": "", "weight": "לפי כמות", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "תפוח", "brand": "כללי", "barcode": "", "weight": "1 תפוח בינוני", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ספרייט זירו", "brand": "קוקה-קולה", "barcode": "7290013585233", "weight": "330 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "חזה עוף מוכן", "brand": "כללי", "barcode": "", "weight": "לפי משקל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "אורז בסמטי מבושל", "brand": "כללי", "barcode": "", "weight": "לפי משקל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "קוקה-קולה זירו", "brand": "קוקה-קולה", "barcode": "7290110115869", "weight": "1.5 ליטר", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "דנונה PRO 13 מעדן חלב בטעם שוקולד", "brand": "דנונה / שטראוס", "barcode": "7290110557102", "weight": "150 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "דנונה PRO 11 מעדן חלב בטעם וניל", "brand": "דנונה / שטראוס", "barcode": "7290110571382", "weight": "150 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "קוטג׳ תנובה 5%", "brand": "תנובה", "barcode": "7290004127329", "weight": "250 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "יוגורט יוטבתה 0% שומן", "brand": "יוטבתה", "barcode": "7290004124469", "weight": "200 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "רוטב צ׳ילי מתוק", "brand": "מאסטר שף", "barcode": "7290013358530", "weight": "700 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "סימפוניה גבינת במרקם שמנת 5% בטעם טבעי", "brand": "סימפוניה / שטראוס", "barcode": "7290004584351", "weight": "200 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "רוטב סויה קלאסי", "brand": "אסם", "barcode": "7290118425526", "weight": "290 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "חלב טרי 1%", "brand": "תנובה", "barcode": "7290000042435", "weight": "1 ליטר", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "חלב טרי 3%", "brand": "תנובה", "barcode": "7290004131074", "weight": "1 ליטר", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "סילאן טבעי 100% תמרים", "brand": "שקדיה", "barcode": "7290113190863", "weight": "385 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ממרח שוקולד חלבי", "brand": "השחר העולה", "barcode": "7290000416021", "weight": "500 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "מעדן חלב GO בטעם שוקולד 12 ג׳ חלבון", "brand": "תנובה GO", "barcode": "7290110329136", "weight": "120 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "גבינה לבנה 5% שומן", "brand": "תנובה", "barcode": "7290000048185", "weight": "250 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "פסטרמה הודו גתים - דלת שומן", "brand": "טירת צבי", "barcode": "7290000364292", "weight": "120 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "רוטב טריאקי", "brand": "טעמי אסיה", "barcode": "7290011966888", "weight": "300 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "פרו – משקה חלב עם בננה ודגנים מלאים", "brand": "יטבתה פרו / שטראוס", "barcode": "7290112343420", "weight": "350 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "פרו 25 משקה קפה עם חלבון חלב 1.5%", "brand": "יטבתה / שטראוס", "barcode": "7290107954976", "weight": "350 מ״ל", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ממרח לייט הלמנס – ממרח מופחת קלוריות", "brand": "הלמנס", "barcode": "7290000120874", "weight": "424 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "קטשופ 50% פחות סוכר ונתרן", "brand": "היינץ", "barcode": "8715700124964", "weight": "435 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ערגליות שוקו", "brand": "אסם", "barcode": "7290008775816", "weight": "300 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "תנובה / גלבוע", "brand": "200 גרם", "barcode": "גבינה צהובה גלבוע לייט 5% שומן, פרוסות", "weight": 177, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "חלי ממן", "brand": "700 גרם", "barcode": "לחם אחיד פלוס כוסמין מרובע", "weight": 205, "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "מקופלת", "brand": "עלית", "barcode": "72917589", "weight": "25 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "רמזור", "brand": "פלדמן", "barcode": "7290101105145", "weight": "80 גרם", "kcal": 0, "protein": 0, "carbs": 0, "fat": 0}, {"name": "ספגטי מס' 8", "brand": "אסם", "barcode": "7290000608808", "weight": "500 גרם", "kcal": 351, "protein": 11, "carbs": 71, "fat": 1.9}]}; const KEY="calorie_app_v2"; let state=JSON.parse(localStorage.getItem(KEY)||"null")||{products:DATA.products,consumption:[]}; let selected=null;
const $=id=>document.getElementById(id); const day=()=>new Date().toISOString().slice(0,10);
function save(){localStorage.setItem(KEY,JSON.stringify(state));}
function totals(d){return state.consumption.filter(x=>x.date===d).reduce((a,x)=>({k:a.k+x.k,p:a.p+x.p,c:a.c+x.c,f:a.f+x.f}),{k:0,p:0,c:0,f:0})}
function active(btn){[$("todayBtn"),$("dbBtn"),$("monthBtn")].forEach(x=>x.classList.remove("active"));btn.classList.add("active");}
function today(){active($("todayBtn"));let t=totals(day());$("screen").innerHTML=`<div class="title">היום</div><div class="card"><div class="muted">נצרכו היום</div><div class="kcal">${Math.round(t.k)} קלוריות</div><div class="muted">יעד: 2,000</div><div class="macro"><div><b>${t.p.toFixed(1)}</b>חלבון / 150</div><div><b>${t.c.toFixed(1)}</b>פחמימות / 200</div><div><b>${t.f.toFixed(1)}</b>שומן / 67</div></div></div><button class="primary" id="open">＋ הוסף מזון</button>`;$("open").onclick=openModal}
function db(){active($("dbBtn"));$("screen").innerHTML=`<div class="title">מאגר מוצרים</div><div class="card"><input id="dbSearch" placeholder="חיפוש מוצר או ברקוד"><div id="dbList"></div></div>`;let q=$("dbSearch"),list=$("dbList");function draw(){let v=q.value.toLowerCase();list.innerHTML=state.products.filter(x=>(x.name+" "+x.brand+" "+x.barcode).toLowerCase().includes(v)).slice(0,60).map(x=>`<div class="item"><div><b>${x.name}</b><small>${x.brand} · ${x.kcal} קל׳ ל־100 ג׳ · חלבון ${x.protein} ג׳</small></div></div>`).join("")||"<div class='muted'>לא נמצא מוצר</div>"}q.oninput=draw;draw()}
function month(){active($("monthBtn"));let days=[...new Set(state.consumption.map(x=>x.date))].sort().reverse();$("screen").innerHTML=`<div class="title">חודש</div><div class="card">${days.length?days.map(d=>{let t=totals(d),dif=t.k-2000;let color=dif>0?"#c62828":dif<0?"#25834a":"#b28700";return `<div class="item"><div><b>${d}</b><small>${Math.round(t.k)} קל׳ · חלבון ${t.p.toFixed(1)} ג׳</small></div><b style="color:${color}">${dif>0?"+":""}${Math.round(dif)}</b></div>`}).join(""):"<div class='muted'>אין עדיין צריכה שנשמרה באפליקציה.</div>"}</div>`}
function openModal(){selected=null;$("modal").classList.add("open");$("search").value="";$("amountBox").style.display="none";$("choices").innerHTML="<div class='muted'>הקלד לחיפוש מוצר</div>";$("search").focus()}
$("search").oninput=()=>{let v=$("search").value.toLowerCase();let a=state.products.filter(x=>(x.name+" "+x.brand+" "+x.barcode).toLowerCase().includes(v)).slice(0,15);$("choices").innerHTML=a.map((x,i)=>`<div class="choice" data-i="${state.products.indexOf(x)}"><b>${x.name}</b><small>${x.brand} · ${x.kcal} קל׳ ל־100 ג׳</small></div>`).join("")||"<div class='muted'>לא נמצא</div>";document.querySelectorAll(".choice").forEach(e=>e.onclick=()=>{selected=state.products[+e.dataset.i];$("amountBox").style.display="block";$("amount").focus()})};
$("add").onclick=()=>{let g=+$("amount").value;if(!selected||!(g>0))return;let f=g/100;state.consumption.push({date:day(),name:selected.name,grams:g,k:selected.kcal*f,p:selected.protein*f,c:selected.carbs*f,f:selected.fat*f});save();$("modal").classList.remove("open");today()};
$("todayBtn").onclick=today;$("dbBtn").onclick=db;$("monthBtn").onclick=month;$("date").textContent=new Date().toLocaleDateString("he-IL",{weekday:"long",day:"numeric",month:"long",year:"numeric"});today();
</script></body></html>
